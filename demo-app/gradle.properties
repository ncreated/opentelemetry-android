org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -XX:MaxMetaspaceSize=3g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.useFullClasspathForDexingTransform=true

# Demo app BuildConfig fields (read via project.findProperty(...)).
# Define these in ~/.gradle/gradle.properties or pass them via -P... to Gradle.
#
# ANDROID_OTEL_DEMO_CLIENT_TOKEN=...
#
# Staging OTLP endpoints:
# ANDROID_OTEL_STAGING_SPANS_URL=https://...
# ANDROID_OTEL_STAGING_LOGS_URL=https://...
# ANDROID_OTEL_STAGING_METRICS_URL=https://...
#
# Production OTLP endpoints:
# ANDROID_OTEL_PRODUCTION_SPANS_URL=https://...
# ANDROID_OTEL_PRODUCTION_LOGS_URL=https://...
# ANDROID_OTEL_PRODUCTION_METRICS_URL=https://...
